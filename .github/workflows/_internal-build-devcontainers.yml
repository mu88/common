name: Build and release dev containers

on:
  workflow_dispatch:
    inputs:
      dotnet-sdk-version:
        description: '.NET SDK version'
        required: true
  push:
    tags:
      - '*'
    branches:
      - '**'
    paths:
      - ".devcontainer/**"
      - "devcontainers/**"

env:
  DEFAULT_dotnet-sdk-version: 10.0.301

jobs:
  parallel_build_dev_containers:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    strategy:
      matrix:
        package: [
          jekyll,
          node-devcontainer-cli
        ]

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Login to Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and release dev container '${{ matrix.package }}'
        uses: ./.github/actions/build-dev-container
        with:
          dev-container-name: ${{ matrix.package }}
          dotnet-sdk-version: ${{ github.event.inputs.dotnet-sdk-version || env.DEFAULT_dotnet-sdk-version }}

  build_dotnet_and_playwright:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Login to Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # dotnet-playwright's Dockerfile builds FROM the dotnet image. Building both in the same
      # job/runner means the just-built dotnet image is already in the local Docker daemon, so
      # the playwright build resolves it locally instead of pulling from GHCR right after pushing
      # (which is prone to registry propagation delays).
      - name: Build and release dev container 'dotnet'
        uses: ./.github/actions/build-dev-container
        with:
          dev-container-name: dotnet
          dotnet-sdk-version: ${{ github.event.inputs.dotnet-sdk-version || env.DEFAULT_dotnet-sdk-version }}

      - name: Build and release dev container 'dotnet-playwright'
        uses: ./.github/actions/build-dev-container
        with:
          dev-container-name: dotnet-playwright
          dotnet-sdk-version: ${{ github.event.inputs.dotnet-sdk-version || env.DEFAULT_dotnet-sdk-version }}
